# ──────────────────────────────────────────────────────────────
# Schemas: la forma de los datos. Tienen que coincidir con las
# tablas de la base y con las interfaces de src/types/.
# ──────────────────────────────────────────────────────────────
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Book not found
    Author:
      type: object
      required: [id, name, nationality]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Julio Cortázar }
        nationality: { type: string, example: Argentina }
    NewAuthor:
      type: object
      required: [name, nationality]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Julio Cortázar }
        nationality: { type: string, minLength: 1, maxLength: 50, example: Argentina }
    UpdateAuthor:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Julio Cortázar }
        nationality: { type: string, minLength: 1, maxLength: 50, example: Argentina }
    AuthorResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Author"
    AuthorList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Author"
    Book:
      type: object
      required: [id, title, year, author_id, available]
      properties:
        id: { type: integer, example: 1 }
        title: { type: string, example: Rayuela }
        year: { type: integer, example: 1963 }
        author_id: { type: integer, example: 1 }
        available: { type: boolean, example: true }
    NewBook:
      type: object
      required: [title, year, author_id]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, example: Rayuela }
        year: { type: integer, minimum: 1000, maximum: 2100, example: 1963 }
        author_id: { type: integer, example: 1 }
    UpdateBook:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200, example: Rayuela }
        year: { type: integer, minimum: 1000, maximum: 2100, example: 1963 }
        author_id: { type: integer, example: 1 }
    BookResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Book"
    BookPage:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Book"
        total: { type: integer, example: 6 }
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 10 }
    Loan:
      type: object
      required: [id, book_id, member_name, loan_date, return_date]
      properties:
        id: { type: integer, example: 1 }
        book_id: { type: integer, example: 2 }
        member_name: { type: string, example: Sofía }
        loan_date: { type: string, example: "2026-09-22" }
        return_date: { type: string, nullable: true, example: null }
    NewLoan:
      type: object
      required: [book_id, member_name]
      properties:
        book_id: { type: integer, example: 3 }
        member_name: { type: string, minLength: 1, example: Sofía }
    LoanReturn:
      type: object
      required: [return_date]
      properties:
        return_date: { type: string, example: "2026-09-30" }
    LoanResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Loan"
    LoanList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Loan"
