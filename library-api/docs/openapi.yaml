# Contrato de la Library API, en formato OpenAPI 3.0.
# Se sirve en http://localhost:3000/docs con Swagger UI. Guardá el archivo y recargá la página.
#
# Regla de toda la clase: el contrato de un endpoint se escribe ACÁ antes de programarlo.

openapi: 3.0.3

info:
  title: Library API
  version: 1.0.0
  description: |
    Books, authors and loans of a library.

    **Conventions**
    - All requests and responses are JSON.
    - Dates use the `YYYY-MM-DD` format.
    - Successful responses with a body have the shape `{ "data": ... }`: an object for one item, an array for a list.
    - Paginated lists add the pagination fields next to `data`: `{ "data": [...], "total": 6, "page": 1, "limit": 10 }`.
    - `204` responses have no body.
    - All errors have the shape `{ "error": "..." }` (see the `Error` schema).

servers:
  - url: http://localhost:3000

# ──────────────────────────────────────────────────────────────
# Endpoints. Un bloque por ruta; dentro, un bloque por verbo.
# /books ya está escrito. Extra: /authors y /loans; abajo hay una plantilla comentada para copiar.
# ──────────────────────────────────────────────────────────────
paths:
  /books:
    get:
      summary: Search books with filters and pagination
      tags: [Books]
      parameters:
        - name: title
          in: query
          required: false
          schema: { type: string }
        - name: available
          in: query
          required: false
          schema: { type: boolean }
        - name: author_id
          in: query
          required: false
          schema: { type: integer }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 10 }
      responses:
        "200":
          description: Page of books
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookPage"
        "400":
          description: Invalid query param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a book
      tags: [Books]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBook"
      responses:
        "201":
          description: Book created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "404":
          description: Author not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /books/{id}:
    get:
      summary: Get a book by id
      tags: [Books]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Book found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "400":
          description: Id is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update some fields of a book
      tags: [Books]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBook"
      responses:
        "200":
          description: Book updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "400":
          description: Id is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Book or author not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Replace all fields of a book
      tags: [Books]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBook"
      responses:
        "200":
          description: Book replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "400":
          description: Id is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Book or author not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a book (only if it was never loaned)
      tags: [Books]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Book deleted
        "400":
          description: Id is not a number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Book has loans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

